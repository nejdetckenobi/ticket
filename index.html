<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title></title>
  <style>
    body {
      margin: 0;
      font-family: sans-serif;
    }

    nav {
      display: flex;
      width: 100%;
    }

    nav button {
      flex: 1;
      min-height: 44px;
      font-size: 16px;
    }

    .tab-content {
      min-height: calc(100vh - 44px);
      display: none;
      box-sizing: border-box;
      padding: 16px;
    }

    .tab-content.active {
      display: block;
    }

    .tab-content input,
    .tab-content button {
      box-sizing: border-box;
      width: 100%;
      min-height: 44px;
      margin-bottom: 12px;
      font-size: 16px;
      padding: 10px 12px;
    }

    .tab-content input {
      text-align: center;
    }

    .field {
      display: block;
      margin-bottom: 12px;
    }

    .field > span {
      display: block;
      margin-bottom: 6px;
      text-align: center;
    }

    .field input {
      margin-bottom: 0;
    }

    #duplicateSetting {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
    }

    #duplicateSetting input {
      width: auto;
      min-height: auto;
      margin: 0;
    }

    #reader {
      width: 100%;
      aspect-ratio: 1 / 1;
      background: black;
      margin-bottom: 12px;
      overflow: hidden;
    }

    #reader video {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
    }

    #result {
      background: white;
      padding: 12px;
      min-height: 44px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      font-family: monospace;
      border: 2px solid transparent;
    }

    #result.success {
      background: #e8f5e9;
      border-color: #2e7d32;
    }

    #result.duplicate {
      background: #fff8e1;
      border-color: #f9a825;
    }

    #result.invalid {
      background: #ffebee;
      border-color: #c62828;
    }

    #settingsNotice {
      min-height: 24px;
      text-align: center;
      margin-top: 8px;
    }

    #tab3 {
      position: relative;
      padding-bottom: 124px;
    }

    #settingsActions {
      position: fixed;
      left: 16px;
      right: 16px;
      bottom: 0;
      background: white;
      padding-top: 12px;
    }

    #tab4 {
      display: none;
      position: relative;
      padding-bottom: 124px;
    }

    #tab4.active {
      display: block;
    }

    #historyList {
      font-family: monospace;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .history-item {
      padding: 12px 0;
      border-bottom: 1px solid #ccc;
    }

    #historyActions {
      position: fixed;
      left: 16px;
      right: 16px;
      bottom: 0;
      background: white;
      padding-top: 12px;
    }
  </style>

  <script>
    const libraryPromise = (async () => {
      const urls = [
        "https://cdn.jsdelivr.net/npm/qrious@4.0.2/dist/qrious.min.js",
        "https://cdn.jsdelivr.net/npm/crypto-js@4.2.0/crypto-js.min.js",
        "https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"
      ];

      for (const url of urls) {
        const response = await fetch(url);
        if (!response.ok) {
          throw new Error(`Library could not be loaded: ${url}`);
        }

        const source = await response.text();
        (0, eval)(source);
      }
    })();
  </script>
</head>
<body>
  <nav>
    <button type="button" data-tab="tab1">Generate</button>
    <button type="button" data-tab="tab2">Validate</button>
    <button type="button" data-tab="tab3">Settings</button>
    <button type="button" data-tab="tab4">History</button>
  </nav>

  <section id="tab1" class="tab-content">
    <label class="field">
      <span>Full name</span>
      <input type="text" id="fullname">
    </label>
    <button type="button" id="generateBtn">Generate invitation</button>
  </section>

  <section id="tab2" class="tab-content">
    <div id="reader">
      <video id="qrVideo" playsinline></video>
    </div>
    <div id="result"></div>
  </section>

  <section id="tab3" class="tab-content active">
    <label class="field">
      <span>Key</span>
      <input type="text" id="shared_key">
    </label>
    <label class="field">
      <span>Event name</span>
      <input type="text" id="event_name">
    </label>
    <label class="field">
      <span>Validation cooldown (seconds)</span>
      <input type="number" id="cooldown_seconds" min="0" step="1">
    </label>
    <div id="settingsNotice"></div>
    <label id="duplicateSetting">
      <input type="checkbox" id="preventDuplicates">
      Prevent duplicate validation
    </label>
    <div id="settingsActions">
      <button type="button" id="saveSettingsBtn">Save</button>
      <button type="button" id="clearSettingsBtn">Clear</button>
    </div>
  </section>

  <section id="tab4" class="tab-content">
    <div id="historyList"></div>
    <div id="historyActions">
      <button type="button" id="exportHistoryBtn">Export CSV</button>
      <button type="button" id="clearHistoryBtn">Clear history</button>
    </div>
  </section>

  <script>
    const buttons = document.querySelectorAll("[data-tab]");
    const contents = document.querySelectorAll(".tab-content");

    buttons.forEach((button) => {
      button.addEventListener("click", async () => {
        const targetTab = button.dataset.tab;

        contents.forEach((content) => content.classList.remove("active"));
        document.getElementById(targetTab).classList.add("active");

        if (targetTab === "tab2") {
          await startCamera();
        } else {
          stopCamera();
        }

        if (targetTab === "tab4") {
          renderHistory();
        }
      });
    });

    function base64UrlEncode(value) {
      return CryptoJS.enc.Base64.stringify(
        CryptoJS.enc.Utf8.parse(value)
      )
        .replace(/=+$/g, "")
        .replace(/\+/g, "-")
        .replace(/\//g, "_");
    }

    function base64UrlDecode(value) {
      const normalized = value
        .replace(/-/g, "+")
        .replace(/_/g, "/");

      const padded = normalized + "=".repeat((4 - normalized.length % 4) % 4);

      return CryptoJS.enc.Base64.parse(padded)
        .toString(CryptoJS.enc.Utf8);
    }

    function createHmacSignature(keyText, message) {
      return CryptoJS.enc.Base64.stringify(
        CryptoJS.HmacSHA256(message, keyText)
      )
        .replace(/=+$/g, "")
        .replace(/\+/g, "-")
        .replace(/\//g, "_");
    }

    async function generateInvitation() {
      await libraryPromise;
      const settings = getSavedSettings();
      const key = settings.key;
      const eventName = settings.eventName;
      const fullname = document.getElementById("fullname").value;

      if (!key || !eventName || !fullname) {
        alert("Fill in all fields.");
        return;
      }

      const header = base64UrlEncode(JSON.stringify({
        alg: "HS256",
        typ: "INV"
      }));

      const payload = base64UrlEncode(JSON.stringify({
        e: eventName,
        f: fullname
      }));

      const signingInput = `${header}.${payload}`;
      const signature = createHmacSignature(key, signingInput);
      const invitationText = `${signingInput}.${signature}`;

      try {
        const qr = new QRious({
          value: invitationText,
          size: 800,
          level: "M"
        });

        const dataUrl = qr.toDataURL("image/png");
        const response = await fetch(dataUrl);
        const blob = await response.blob();
        const file = new File([blob], "invitation.png", {
          type: "image/png"
        });

        if (
          navigator.canShare &&
          navigator.canShare({ files: [file] }) &&
          navigator.share
        ) {
          await navigator.share({
            files: [file],
            title: "Invitation"
          });
          return;
        }

        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url;
        link.download = "invitation.png";
        document.body.appendChild(link);
        link.click();
        link.remove();

        setTimeout(() => URL.revokeObjectURL(url), 1000);
      } catch (error) {
        if (error && error.name === "AbortError") {
          return;
        }

        alert(`QR generation failed: ${error.message}`);
      }
    }

    function showValidationResult(message, type) {
      const result = document.getElementById("result");
      result.textContent = message;
      result.className = type || "";

      if (resultClearTimer) {
        clearTimeout(resultClearTimer);
      }

      resultClearTimer = setTimeout(() => {
        result.textContent = "";
        result.className = "";
        resultClearTimer = null;
      }, 20000);
    }

    function handleQrResult(decodedText) {
      const key = getSavedSettings().key;
      const result = document.getElementById("result");

      if (!key) {
        showValidationResult("Enter a key.", "invalid");
        return;
      }

      const parts = decodedText.split(".");

      if (parts.length !== 3) {
        showValidationResult("Invalid invitation", "invalid");
        return;
      }

      const [headerPart, payloadPart, signature] = parts;
      const signingInput = `${headerPart}.${payloadPart}`;
      const expectedSignature = createHmacSignature(key, signingInput);

      if (signature !== expectedSignature) {
        showValidationResult("Invalid invitation", "invalid");
        return;
      }

      try {
        const header = JSON.parse(base64UrlDecode(headerPart));
        const payload = JSON.parse(base64UrlDecode(payloadPart));

        if (
          header.alg !== "HS256" ||
          typeof payload.e !== "string" ||
          typeof payload.f !== "string"
        ) {
          throw new Error("Invalid invitation");
        }

        const settings = getSavedSettings();
        const history = getHistory();
        const alreadyScanned = history.some(
          (item) => item.token === decodedText
        );

        if (settings.preventDuplicates && alreadyScanned) {
          showValidationResult("Invitation already validated", "duplicate");
          return;
        }

        showValidationResult(`Event: ${payload.e}\nFullname: ${payload.f}`, "success");
        const cooldownSeconds =
          Number(getSavedSettings().cooldownSeconds) || 0;
        validationCooldownUntil =
          Date.now() + Math.max(0, cooldownSeconds) * 1000;
        saveHistory({ ...payload, token: decodedText });
      } catch {
        showValidationResult("Invalid invitation", "invalid");
      }
    }

    document.getElementById("generateBtn")
      .addEventListener("click", generateInvitation);

    const SETTINGS_KEY = "invitation_settings";

    function getSavedSettings() {
      try {
        return JSON.parse(localStorage.getItem(SETTINGS_KEY) || "{}");
      } catch {
        return {};
      }
    }

    function loadSettings() {
      const settings = getSavedSettings();
      document.getElementById("shared_key").value = settings.key || "";
      document.getElementById("event_name").value = settings.eventName || "";
      document.getElementById("cooldown_seconds").value =
        Number.isFinite(settings.cooldownSeconds)
          ? settings.cooldownSeconds
          : 5;
      document.getElementById("preventDuplicates").checked =
        Boolean(settings.preventDuplicates);
    }

    function saveSettings() {
      const key = document.getElementById("shared_key").value;
      const eventName = document.getElementById("event_name").value;
      const cooldownSeconds = Math.max(
        0,
        Number(document.getElementById("cooldown_seconds").value) || 0
      );
      const preventDuplicates =
        document.getElementById("preventDuplicates").checked;

      localStorage.setItem(
        SETTINGS_KEY,
        JSON.stringify({
          key,
          eventName,
          cooldownSeconds,
          preventDuplicates
        })
      );

      const notice = document.getElementById("settingsNotice");
      notice.textContent = "Saved";

      setTimeout(() => {
        notice.textContent = "";
      }, 2000);
    }

    function clearSettings() {
      if (!confirm("Clear saved settings?")) {
        return;
      }

      localStorage.removeItem(SETTINGS_KEY);
      document.getElementById("shared_key").value = "";
      document.getElementById("event_name").value = "";
      document.getElementById("cooldown_seconds").value = "5";
      document.getElementById("preventDuplicates").checked = false;
      document.getElementById("settingsNotice").textContent = "";
    }

    document.getElementById("saveSettingsBtn")
      .addEventListener("click", saveSettings);

    document.getElementById("clearSettingsBtn")
      .addEventListener("click", clearSettings);

    loadSettings();

    const HISTORY_KEY = "invitation_history";

    function getHistory() {
      try {
        return JSON.parse(localStorage.getItem(HISTORY_KEY) || "[]");
      } catch {
        return [];
      }
    }

    function saveHistory(payload) {
      const history = getHistory();

      history.unshift({
        token: payload.token,
        e: payload.e,
        f: payload.f,
        scannedAt: new Date().toISOString()
      });

      localStorage.setItem(HISTORY_KEY, JSON.stringify(history));
    }

    function formatLocalTimestamp(isoString) {
      const date = new Date(isoString);
      const pad = (value) => String(value).padStart(2, "0");

      return [
        date.getFullYear(),
        pad(date.getMonth() + 1),
        pad(date.getDate())
      ].join("-") + " " + [
        pad(date.getHours()),
        pad(date.getMinutes()),
        pad(date.getSeconds())
      ].join(":");
    }

    function renderHistory() {
      const historyList = document.getElementById("historyList");
      const history = getHistory();

      if (history.length === 0) {
        historyList.textContent = "No history";
        return;
      }

      historyList.replaceChildren();

      history.forEach((item) => {
        const element = document.createElement("div");
        element.className = "history-item";
        element.textContent =
          `Event: ${item.e}\nFull name: ${item.f}\nScanned at: ${formatLocalTimestamp(item.scannedAt)}`;
        historyList.appendChild(element);
      });
    }

    function clearHistory() {
      if (!confirm("Clear all history?")) {
        return;
      }

      localStorage.removeItem(HISTORY_KEY);
      renderHistory();
    }

    function escapeCsv(value) {
      const text = String(value ?? "");
      return `"${text.replace(/"/g, '""')}"`;
    }

    function exportHistory() {
      const history = getHistory();

      if (history.length === 0) {
        return;
      }

      const rows = [
        ["event", "full_name", "scanned_at"],
        ...history.map((item) => [
          item.e,
          item.f,
          item.scannedAt
        ])
      ];

      const csv = rows
        .map((row) => row.map(escapeCsv).join(","))
        .join("\r\n");

      const blob = new Blob([csv], {
        type: "text/csv;charset=utf-8"
      });

      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = "invitation-history.csv";
      document.body.appendChild(link);
      link.click();
      link.remove();

      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }

    document.getElementById("exportHistoryBtn")
      .addEventListener("click", exportHistory);

    document.getElementById("clearHistoryBtn")
      .addEventListener("click", clearHistory);

    const resultElement = document.getElementById("result");
    const video = document.getElementById("qrVideo");
    const scanCanvas = document.createElement("canvas");
    const scanContext = scanCanvas.getContext("2d", {
      willReadFrequently: true
    });

    let cameraStream = null;
    let scanning = false;
    let lastVisibleQr = null;
    let resultClearTimer = null;
    let validationCooldownUntil = 0;

    function decodeCanvas(canvas, context) {
      const imageData = context.getImageData(
        0,
        0,
        canvas.width,
        canvas.height
      );

      return jsQR(
        imageData.data,
        imageData.width,
        imageData.height,
        { inversionAttempts: "attemptBoth" }
      );
    }

    function stopCamera() {
      scanning = false;
      lastVisibleQr = null;

      if (cameraStream) {
        cameraStream.getTracks().forEach((track) => track.stop());
        cameraStream = null;
      }

      video.srcObject = null;
    }

    function scanVideo() {
      if (!scanning) return;

      if (video.readyState >= HTMLMediaElement.HAVE_CURRENT_DATA) {
        scanCanvas.width = video.videoWidth;
        scanCanvas.height = video.videoHeight;

        scanContext.drawImage(
          video,
          0,
          0,
          scanCanvas.width,
          scanCanvas.height
        );

        const code = decodeCanvas(scanCanvas, scanContext);

        if (Date.now() < validationCooldownUntil) {
          requestAnimationFrame(scanVideo);
          return;
        }

        if (code && typeof code.data === "string" && code.data.length > 0) {
          if (code.data !== lastVisibleQr) {
            lastVisibleQr = code.data;
            handleQrResult(code.data);
          }
        } else {
          lastVisibleQr = null;
        }
      }

      requestAnimationFrame(scanVideo);
    }

    async function startCamera() {
      try {
        await libraryPromise;
        if (typeof jsQR !== "function") {
          throw new Error("QR decoder could not be loaded.");
        }

        stopCamera();

        cameraStream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: { ideal: "environment" }
          },
          audio: false
        });

        video.srcObject = cameraStream;
        await video.play();

        scanning = true;
        requestAnimationFrame(scanVideo);
      } catch (error) {
        let message = "Camera could not be started.";

        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          message = "Camera access is not supported by this browser.";
        } else if (error && error.name === "NotAllowedError") {
          message = "Camera permission was denied. Allow camera access in browser settings.";
        } else if (error && error.name === "NotFoundError") {
          message = "No camera was found on this device.";
        } else if (error && error.name === "NotReadableError") {
          message = "The camera is already in use by another application.";
        } else if (error && error.name === "OverconstrainedError") {
          message = "The requested camera mode is not available.";
        } else if (error && error.name === "SecurityError") {
          message = "Camera access requires a secure context such as HTTPS.";
        } else if (error && error.message) {
          message = error.message;
        }

        showValidationResult(message, "invalid");
      }
    }

  </script>
</body>
</html>
