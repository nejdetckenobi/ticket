<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#000000">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net https://accounts.google.com https://apis.google.com; frame-src https://accounts.google.com https://docs.google.com https://drive.google.com; connect-src 'self' https://accounts.google.com https://oauth2.googleapis.com https://*.googleapis.com; img-src 'self' data: blob: https://*.googleusercontent.com; style-src 'self' 'unsafe-inline' https://accounts.google.com; media-src 'self' blob:">
  <title></title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="styles.css">
  <script src="library-loader.js"></script>
</head>
<body>
  <nav>
    <button type="button" data-tab="tab1">Generate</button>
    <button type="button" data-tab="tab2">Validate</button>
    <button type="button" data-tab="tab3">Settings</button>
    <button type="button" data-tab="tab4">History</button>
  </nav>

  <section id="tab1" class="tab-content">
    <label class="field">
      <span>Full name</span>
      <input type="text" id="fullname">
    </label>
    <button type="button" id="generateBtn">Generate invitation</button>
  </section>

  <section id="tab2" class="tab-content">
    <div id="reader">
      <video id="qrVideo" playsinline></video>
    </div>
    <div id="result"></div>
  </section>

  <section id="tab3" class="tab-content active">
    <label class="field">
      <span>Key</span>
      <input type="text" id="shared_key">
    </label>
    <label class="field">
      <span>Event name</span>
      <input type="text" id="event_name">
    </label>
    <label class="field">
      <span>Validation cooldown (seconds)</span>
      <input type="number" id="cooldown_seconds" min="0" step="1">
    </label>
    <fieldset id="historyStorageSetting">
      <legend>History storage</legend>
      <div class="storage-options">
        <label><input type="radio" name="historyStorage" value="local" checked> Local</label>
        <label><input type="radio" name="historyStorage" value="google"> Google</label>
      </div>
      <div id="googleStorageStatus" class="storage-status" role="status" aria-live="polite">Stored on this device</div>
    </fieldset>
    <div id="settingsNotice"></div>
    <label id="duplicateSetting">
      <input type="checkbox" id="preventDuplicates">
      Prevent duplicate validation
    </label>
    <div id="settingsActions">
      <button type="button" id="saveSettingsBtn">Save</button>
      <button type="button" id="clearSettingsBtn">Clear</button>
    </div>
  </section>

  <section id="tab4" class="tab-content">
    <div id="historyList"></div>
    <div id="historyActions">
      <button type="button" id="exportHistoryBtn">Export CSV</button>
      <button type="button" id="clearHistoryBtn">Clear history</button>
    </div>
  </section>

  <script src="google-config.js"></script>
  <script src="google-storage.js"></script>
  <script src="script.js"></script>

</body>
</html>
