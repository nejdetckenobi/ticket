<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>TicketToken</title>
  <link rel="manifest" href="manifest.webmanifest">
  <script src="theme-loader.js"></script>
  <link rel="stylesheet" href="styles.css">
  <script src="google-config.js"></script>
  <script async defer src="https://accounts.google.com/gsi/client"></script>
  <script async defer src="https://apis.google.com/js/api.js"></script>
  <script src="library-loader.js"></script>
</head>
<body>
  <nav>
    <button type="button" data-tab="tab1">Home</button>
    <button type="button" data-tab="tab2">Settings</button>
    <button type="button" data-tab="tab3">Generate</button>
    <button type="button" data-tab="tab4">Validate</button>
    <button type="button" data-tab="tab5">History</button>
  </nav>

  <section id="tab1" class="tab-content active">
    <header id="appIntroduction">
      <h1>TicketToken</h1>
      <p>
        Create signed invitation QR codes, validate them with your device
        camera, and optionally record successful validations in a Google Sheets
        file that you select.
      </p>
    </header>
  </section>

  <section id="tab2" class="tab-content">
    <label class="field">
      <span>Key</span>
      <input type="text" id="shared_key">
    </label>
    <label class="field">
      <span>Event name</span>
      <input type="text" id="event_name">
    </label>
    <label class="field">
      <span>QR logo (PNG, JPEG or WebP; maximum 64×64)</span>
      <input
        type="file"
        id="logoFile"
        accept="image/png,image/jpeg,image/webp"
      >
    </label>
    <div id="logoPreviewContainer" hidden>
      <img id="logoPreview" alt="Selected QR logo preview">
      <button type="button" id="removeLogoBtn">Remove logo</button>
    </div>
    <label class="field">
      <span>Validation cooldown (seconds)</span>
      <input type="number" id="cooldown_seconds" min="0" step="1">
    </label>
    <fieldset id="storageSetting">
      <legend>Storage</legend>
      <label>
        <input type="radio" name="storageType" value="local" checked>
        Local
      </label>
      <label>
        <input type="radio" name="storageType" value="google">
        Google
      </label>
    </fieldset>
    <div id="googleStorageSettings" hidden>
      <button type="button" id="selectGoogleSpreadsheetBtn">
        Connect Google / Select spreadsheet
      </button>
      <div id="googleSpreadsheetStatus"></div>
    </div>
    <div id="settingsNotice"></div>
    <label id="duplicateSetting">
      <input type="checkbox" id="preventDuplicates">
      Prevent duplicate validation
    </label>
    <label id="darkModeSetting">
      <input type="checkbox" id="darkMode">
      Dark mode
    </label>
    <p id="legalLinks">
      <a href="privacy.html">Privacy Policy</a>
      ·
      <a href="terms.html">Terms of Service</a>
    </p>
    <div id="settingsActions">
      <button type="button" id="saveSettingsBtn">Save</button>
      <button type="button" id="clearSettingsBtn">Clear</button>
    </div>
  </section>

  <section id="tab3" class="tab-content">
    <label class="field">
      <span>Full name</span>
      <input type="text" id="fullname">
    </label>
    <button type="button" id="generateBtn">Generate invitation</button>
  </section>

  <section id="tab4" class="tab-content">
    <div id="reader">
      <video id="qrVideo" playsinline></video>
    </div>
    <div id="result"></div>
  </section>

  <section id="tab5" class="tab-content">
    <div id="historyList"></div>
    <div id="historyActions">
      <button type="button" id="exportHistoryBtn">Export CSV</button>
      <button type="button" id="clearHistoryBtn">Clear history</button>
    </div>
  </section>

  <script src="script.js"></script>

</body>
</html>
